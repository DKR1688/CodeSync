server.port=${PORT:10000}

management.health.rabbit.enabled=${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.jpa.show-sql=false

codesync.gateway-base-url=${CODESYNC_GATEWAY_BASE_URL:${AUTH_URL:${API_URL:https://codesync-api-gateway.onrender.com}}}
codesync.frontend-base-url=${CODESYNC_FRONTEND_BASE_URL:${FRONTEND_URL:https://codesync-frontend-ks8q.onrender.com}}

spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:${codesync.gateway-base-url}/login/oauth2/code/github}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:${codesync.gateway-base-url}/login/oauth2/code/google}
