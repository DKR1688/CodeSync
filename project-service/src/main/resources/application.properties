spring.config.import=optional:file:../auth-service/.env[.properties]

spring.application.name=project-service
server.port=${PORT:8082}
server.address=0.0.0.0

spring.datasource.url=${PROJECT_DATASOURCE_URL:${DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:project_db}?createDatabaseIfNotExist=true&sslMode=${MYSQL_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC}}
spring.datasource.username=${PROJECT_DATASOURCE_USERNAME:${DATASOURCE_USERNAME:${MYSQL_USER:root}}}
spring.datasource.password=${PROJECT_DATASOURCE_PASSWORD:${DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:mysupersecretkeymysupersecretkey1234567890}

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

server.error.include-message=always
server.error.include-binding-errors=always

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
management.health.rabbit.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.repositories.enabled=false
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
management.health.redis.enabled=true

codesync.rabbit.exchange=${CODESYNC_RABBIT_EXCHANGE:codesync.events}
codesync.rabbit.routing-key.notification-send=${CODESYNC_RABBIT_NOTIFICATION_SEND_ROUTING_KEY:notification.send}
codesync.rabbit.routing-key.project-created=${CODESYNC_RABBIT_PROJECT_CREATED_ROUTING_KEY:project.created}
codesync.rabbit.routing-key.project-member-added=${CODESYNC_RABBIT_PROJECT_MEMBER_ADDED_ROUTING_KEY:project.member.added}
