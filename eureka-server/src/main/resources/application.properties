spring.application.name=eureka-server
server.port=${PORT:8761}
server.address=0.0.0.0

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.server.enable-self-preservation=${EUREKA_ENABLE_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=${EUREKA_EVICTION_INTERVAL_MS:10000}
eureka.server.response-cache-update-interval-ms=${EUREKA_RESPONSE_CACHE_UPDATE_INTERVAL_MS:5000}

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
