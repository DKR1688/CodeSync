server.port=${PORT:10000}

spring.datasource.url=${COLLAB_PROD_DATASOURCE_URL:jdbc:h2:mem:collab-prod;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${COLLAB_PROD_DATASOURCE_USERNAME:sa}
spring.datasource.password=${COLLAB_PROD_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${COLLAB_PROD_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0

spring.jpa.database-platform=${COLLAB_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${COLLAB_DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.show-sql=false

project.service.url=${PROJECT_SERVICE_URL:https://codesync-project-service.onrender.com}
file.service.url=${FILE_SERVICE_URL:https://codesync-file-service.onrender.com}

management.health.db.enabled=false
