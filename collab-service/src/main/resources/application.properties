spring.config.import=optional:file:../auth-service/.env[.properties]

spring.application.name=collab-service
server.port=${PORT:8084}
server.address=0.0.0.0

spring.datasource.url=${COLLAB_DATASOURCE_URL:${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:${DB_HOST:localhost}}}:${MYSQLPORT:${MYSQL_PORT:${DB_PORT:3306}}}/${MYSQLDATABASE:${MYSQL_DATABASE:${DB_NAME:collab_db}}}?createDatabaseIfNotExist=true&sslMode=${MYSQL_SSL_MODE:${DB_SSL_MODE:DISABLED}}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}}&serverTimezone=UTC}}}}
spring.datasource.username=${COLLAB_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${MYSQLUSER:${MYSQL_USER:${DB_USER:root}}}}}}
spring.datasource.password=${COLLAB_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:}}}}}}

spring.jpa.hibernate.ddl-auto=${COLLAB_DB_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:mysupersecretkeymysupersecretkey1234567890}

project.service.url=${PROJECT_SERVICE_URL:http://localhost:8082}
file.service.url=${FILE_SERVICE_URL:http://localhost:8083}

server.error.include-message=always
server.error.include-binding-errors=always

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

collab.session.max-idle-minutes=${COLLAB_SESSION_MAX_IDLE_MINUTES:30}
collab.session.cleanup-interval-ms=${COLLAB_SESSION_CLEANUP_INTERVAL_MS:300000}
collab.websocket.allowed-origins=${COLLAB_ALLOWED_ORIGINS:*}


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.dynamic=${RABBITMQ_DYNAMIC:false}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:false}
spring.rabbitmq.listener.direct.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:false}
codesync.rabbit.enabled=${CODESYNC_RABBIT_ENABLED:false}
management.health.rabbit.enabled=${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
management.health.discovery.enabled=${MANAGEMENT_HEALTH_DISCOVERY_ENABLED:false}
