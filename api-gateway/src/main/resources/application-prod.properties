server.port=${PORT:10000}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${GATEWAY_AUTH_SERVICE_URI:https://codesync-auth-service.onrender.com}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/oauth2/**,/login/oauth2/**

spring.cloud.gateway.server.webflux.routes[1].id=project-service
spring.cloud.gateway.server.webflux.routes[1].uri=${GATEWAY_PROJECT_SERVICE_URI:https://codesync-project-service.onrender.com}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/projects/**

