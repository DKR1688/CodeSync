spring.config.import=optional:file:../auth-service/.env[.properties]

spring.application.name=execution-service
server.port=${PORT:8088}
server.address=0.0.0.0

spring.datasource.url=${EXECUTION_DATASOURCE_URL:${DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:execution_db}?createDatabaseIfNotExist=true&sslMode=${MYSQL_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC}}
spring.datasource.username=${EXECUTION_DATASOURCE_USERNAME:${DATASOURCE_USERNAME:${MYSQL_USER:root}}}
spring.datasource.password=${EXECUTION_DATASOURCE_PASSWORD:${DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:mysupersecretkeymysupersecretkey1234567890}

codesync.services.project.base-url=${PROJECT_SERVICE_URL:http://localhost:8082}

codesync.execution.queue.mode=${EXECUTION_QUEUE_MODE:local}
codesync.execution.queue.exchange=${EXECUTION_QUEUE_EXCHANGE:execution.exchange}
codesync.execution.queue.name=${EXECUTION_QUEUE_NAME:execution.jobs}
codesync.execution.queue.routing-key=${EXECUTION_QUEUE_ROUTING_KEY:execution.jobs}
codesync.execution.worker.core-pool-size=${EXECUTION_WORKER_CORE_POOL_SIZE:2}
codesync.execution.worker.max-pool-size=${EXECUTION_WORKER_MAX_POOL_SIZE:4}
codesync.execution.worker.queue-capacity=${EXECUTION_WORKER_QUEUE_CAPACITY:100}

codesync.execution.docker.enabled=${EXECUTION_DOCKER_ENABLED:true}
codesync.execution.workspace-root=${EXECUTION_WORKSPACE_ROOT:./runtime/executions}
codesync.execution.default-time-limit-seconds=${EXECUTION_DEFAULT_TIME_LIMIT_SECONDS:20}
codesync.execution.default-memory-limit-mb=${EXECUTION_DEFAULT_MEMORY_LIMIT_MB:256}
codesync.execution.default-cpu-limit=${EXECUTION_DEFAULT_CPU_LIMIT:1.0}
codesync.execution.max-time-limit-seconds=${EXECUTION_MAX_TIME_LIMIT_SECONDS:60}
codesync.execution.max-memory-limit-mb=${EXECUTION_MAX_MEMORY_LIMIT_MB:512}
codesync.execution.max-source-bytes=${EXECUTION_MAX_SOURCE_BYTES:1048576}
codesync.execution.max-stdin-bytes=${EXECUTION_MAX_STDIN_BYTES:65536}

server.error.include-message=always
server.error.include-binding-errors=always

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

management.endpoints.web.exposure.include=health,info
management.health.discovery.enabled=${MANAGEMENT_HEALTH_DISCOVERY_ENABLED:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.dynamic=${RABBITMQ_DYNAMIC:false}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:false}
spring.rabbitmq.listener.direct.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:false}
management.health.rabbit.enabled=${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}

