server.port=${PORT:10000}

spring.jpa.show-sql=false

spring.datasource.url=${EXECUTION_DATASOURCE_URL:${SPRING_DATASOURCE_URL:${DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:execution_db}?createDatabaseIfNotExist=true&sslMode=${MYSQL_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC}}}

codesync.services.project.base-url=${PROJECT_SERVICE_URL:https://codesync-project-service.onrender.com}
codesync.execution.docker.enabled=${EXECUTION_DOCKER_ENABLED:false}

management.health.discovery.enabled=${MANAGEMENT_HEALTH_DISCOVERY_ENABLED:false}
management.health.rabbit.enabled=${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
